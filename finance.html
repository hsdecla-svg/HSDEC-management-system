<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSDEC Finance Hub - Advanced</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .list-active { background: #eef2ff; border-right: 4px solid #4f46e5; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const GAS_URL = 'YOUR_GAS_URL_HERE'; // ★デプロイURLを入れてください

        function App() {
            const [mode, setMode] = useState('portal');
            const [target, setTarget] = useState('');
            const [records, setRecords] = useState([]);
            const [sel, setSel] = useState(null);
            const [edit, setEdit] = useState(false);
            const [formData, setFormData] = useState({});

            const fetchData = async (m, t) => {
                const res = await fetch(`${GAS_URL}?mode=${m}&target=${encodeURIComponent(t)}`);
                setRecords(await res.json());
            };

            const saveRecord = async () => {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({...formData, mode, target}) });
                setEdit(false);
                fetchData(mode, target);
            };

            // 通貨判定
            const getCurrency = (r) => {
                if(r.v[6] > 0) return {cur: 'LAK', amt: r.v[6], total: r.v[9]};
                if(r.v[5] > 0) return {cur: 'THB', amt: r.v[5], total: r.v[8]};
                return {cur: 'USD', amt: r.v[4], total: r.v[7]};
            };

            if (mode === 'portal') return (
                <div className="h-screen flex flex-col items-center justify-center gap-6 p-4">
                    <button onClick={()=>{setMode('hsdec'); setTarget('ເດືອນ 1'); fetchData('hsdec', 'ເດືອນ 1');}} className="w-full max-w-sm p-8 bg-slate-900 text-white rounded-3xl font-bold">会社全体会計</button>
                    <button onClick={()=>{setMode('korea'); setTarget('ຊຸດທີ 2'); fetchData('korea', 'ຊຸດທີ 2');}} className="w-full max-w-sm p-8 bg-indigo-600 text-white rounded-3xl font-bold">Sessional Worker</button>
                </div>
            );

            return (
                <div className="flex h-screen">
                    <div className="w-80 bg-white border-r overflow-y-auto">
                        <div className="p-4 bg-slate-50 border-b font-bold flex justify-between">
                            {target} <button onClick={()=>{
                                const nextNo = records.length > 0 ? Math.max(...records.map(r=>Number(r.v[0]))) + 1 : 1;
                                setFormData({no: nextNo, date: new Date().toISOString().split('T')[0]});
                                setSel({isNew: true}); setEdit(true);
                            }} className="bg-blue-600 text-white px-3 rounded">+</button>
                        </div>
                        {records.map((r, i) => (
                            <div key={i} onClick={()=>{setSel(r); setEdit(false);}} className={`p-4 border-b cursor-pointer ${sel?.v[0] === r.v[0] ? 'list-active':''}`}>
                                <div className="text-xs text-slate-400">{r.v[1]}</div>
                                <div className="font-bold truncate">{r.v[2]}</div>
                            </div>
                        ))}
                    </div>

                    <div className="flex-1 p-6 overflow-y-auto">
                        {edit ? (
                            <div className="bg-white p-6 rounded-2xl shadow">
                                <h2 className="font-bold mb-4">登録・編集</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <input className="border p-2 rounded" placeholder="日付" type="date" value={formData.date} onChange={e=>setFormData({...formData, date:e.target.value})} />
                                    <input className="border p-2 rounded" placeholder="品名" value={formData.item} onChange={e=>setFormData({...formData, item:e.target.value})} />
                                    <input className="border p-2 rounded" placeholder="個数" type="number" onChange={e=>setFormData({...formData, qty:e.target.value})} />
                                    <input type="file" accept="image/*" capture="environment" onChange={e=>{
                                        const reader = new FileReader();
                                        reader.onload = ev => setFormData({...formData, photo: ev.target.result});
                                        reader.readAsDataURL(e.target.files[0]);
                                    }} />
                                </div>
                                <button onClick={saveRecord} className="mt-6 w-full bg-green-600 text-white py-3 rounded-xl font-bold">保存</button>
                            </div>
                        ) : sel ? (
                            <div className="bg-white p-6 rounded-2xl shadow space-y-4">
                                <h2 className="text-xl font-bold border-b pb-2">No.{sel.v[0]} {sel.v[2]}</h2>
                                <p>日付: {sel.v[1]}</p>
                                <p>個数: {sel.v[3]}</p>
                                <p>単価: {getCurrency(sel).amt} {getCurrency(sel).cur}</p>
                                <p>合計: ₭ {Number(sel.v[11]).toLocaleString()}</p>
                                {sel.v[13] && <img src={sel.v[13]} className="max-w-xs border rounded shadow" />}
                                <button onClick={()=>{setFormData(sel.v); setEdit(true);}} className="bg-amber-500 text-white px-6 py-2 rounded">編集</button>
                            </div>
                        ) : <div className="text-slate-400">項目を選択してください</div>}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
