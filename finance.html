<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSDEC Finance Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Phetsarath&display=swap'); .lao-text { font-family: 'Phetsarath', sans-serif; }</style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxNDBH7DXotcXWgAbNIJswskMfPNQB0E23Azk545Yok9DY62RZbKVD3wRxw-3Ga2lzkuw/exec'; 

        function App() {
            const [mode, setMode] = useState('portal');
            const [target, setTarget] = useState('');
            const [records, setRecords] = useState([]);
            const [sel, setSel] = useState(null);
            const [edit, setEdit] = useState(false);
            const [formData, setFormData] = useState({});

            const fetchData = async (m, t) => {
                const res = await fetch(`${GAS_URL}?mode=${m}&target=${encodeURIComponent(t)}`);
                setRecords(await res.json());
            };

            const update = (f, v) => {
                const next = {...formData, [f]: v};
                if (f === 'qty' || f === 'price') next.total = (next.qty * next.price) || 0;
                setFormData(next);
            };

            if (mode === 'portal') return (
                <div className="h-screen flex flex-col items-center justify-center gap-6">
                    <button onClick={()=>{setMode('hsdec'); setTarget('ເດືອນ 1'); fetchData('hsdec', 'ເດືອນ 1');}} className="p-8 bg-slate-900 text-white rounded-3xl font-bold">HSDEC Global Finance</button>
                    <button onClick={()=>{setMode('korea'); setTarget('ຊຸດທີ 2'); fetchData('korea', 'ຊຸດທີ 2');}} className="p-8 bg-indigo-600 text-white rounded-3xl font-bold">Sessional Worker Korea</button>
                </div>
            );

            return (
                <div className="flex h-screen">
                    <div className="w-80 bg-white border-r overflow-y-auto">
                        <div className="p-4 bg-slate-50 flex justify-between font-bold">{target} <button onClick={()=>{
                            const nextNo = records.length > 0 ? Math.max(...records.map(r=>Number(r.v[0]))) + 1 : 1;
                            setFormData({no: nextNo, date: new Date().toISOString().split('T')[0], currency: 'LAK', qty: 0, price: 0, total: 0});
                            setSel(null); setEdit(true);
                        }} className="bg-blue-600 text-white px-3 rounded">+</button></div>
                        {records.map((r, i) => <div key={i} onClick={()=>{setSel(r); setEdit(false);}} className="p-4 border-b cursor-pointer hover:bg-slate-50 lao-text">{r.v[0]} - {r.v[2]}</div>)}
                    </div>
                    <div className="flex-1 p-6 overflow-y-auto">
                        {edit ? (
                            <div className="bg-white p-6 rounded-2xl shadow grid grid-cols-2 gap-4">
                                <input className="border p-2 rounded" value={formData.no} readOnly />
                                <input className="border p-2 rounded" type="date" value={formData.date} onChange={e=>update('date', e.target.value)} />
                                <input className="col-span-2 border p-2 rounded" placeholder="Item Name" onChange={e=>update('item', e.target.value)} />
                                <select className="border p-2 rounded" onChange={e=>update('currency', e.target.value)}><option>LAK</option><option>USD</option><option>THB</option></select>
                                <input className="border p-2 rounded" type="number" placeholder="Qty" onChange={e=>update('qty', e.target.value)} />
                                <input className="border p-2 rounded" type="number" placeholder="Price" onChange={e=>update('price', e.target.value)} />
                                <div className="col-span-2 font-bold p-3 bg-indigo-50 rounded">Total: {Number(formData.total).toLocaleString()}</div>
                                <input type="file" className="col-span-2" onChange={e=>{
                                    const r = new FileReader(); r.onload = ev => update('photo', ev.target.result); r.readAsDataURL(e.target.files[0]);
                                }} />
                                <button onClick={async()=>{
                                    await fetch(GAS_URL, {method:'POST', body:JSON.stringify({...formData, mode, target})});
                                    setEdit(false); fetchData(mode, target);
                                }} className="col-span-2 bg-green-600 text-white py-3 rounded">Save</button>
                            </div>
                        ) : sel ? (
                            <div className="bg-white p-6 rounded-2xl shadow">
                                <h2 className="text-xl font-bold">No.{sel.v[0]} {sel.v[2]}</h2>
                                <p>Total: {Number(sel.v[11]).toLocaleString()}</p>
                                {sel.v[13] && <img src={sel.v[13]} className="max-w-xs mt-4"/>}
                                <button onClick={()=>{setFormData({row_index:sel.row_index, no:sel.v[0], date:sel.v[1], item:sel.v[2], qty:sel.v[3], total:sel.v[11]}); setEdit(true);}} className="bg-amber-500 text-white px-6 py-2 rounded mt-4">Edit</button>
                            </div>
                        ) : <div className="text-slate-400">Select an entry</div>}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
