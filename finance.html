<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSDEC Finance Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Phetsarath&display=swap');
        .lao-text { font-family: 'Phetsarath', sans-serif; }
        .list-active { background: #eef2ff; border-right: 4px solid #4f46e5; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx2hA6aPsAC8ucpNId_Nv1pFti9eJE7mW7G3n6l0a8KogIUNq_hSQDljXv4-nc3VVy4RQ/exec'; // ★デプロイURLをここに設定

        function App() {
            const [mode, setMode] = useState('portal');
            const [target, setTarget] = useState('');
            const [records, setRecords] = useState([]);
            const [selected, setSelected] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [formData, setFormData] = useState({});

            const fetchData = async (m, t) => {
                const res = await fetch(`${GAS_URL}?mode=${m}&target=${encodeURIComponent(t)}`);
                const data = await res.json();
                setRecords(data);
            };

            const updateField = (field, value) => {
                const newData = { ...formData, [field]: value };
                if (field === 'qty' || field === 'price') {
                    newData.total = (Number(newData.qty) * Number(newData.price)) || 0;
                }
                setFormData(newData);
            };

            const handleNew = () => {
                const nextNo = records.length > 0 ? Math.max(...records.map(r=>Number(r.v[0]))) + 1 : 1;
                setFormData({ no: nextNo, date: new Date().toISOString().split('T')[0], qty: 0, price: 0, total: 0, currency: 'LAK' });
                setSelected(null);
                setIsEditing(true);
            };

            const saveRecord = async () => {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({...formData, mode, target}) });
                setIsEditing(false);
                fetchData(mode, target);
            };

            if (mode === 'portal') return (
                <div className="h-screen flex flex-col items-center justify-center gap-6 p-4">
                    <button onClick={()=>{setMode('hsdec'); setTarget('ເດືອນ 1'); fetchData('hsdec', 'ເດືອນ 1');}} className="w-full max-w-sm p-8 bg-slate-900 text-white rounded-3xl font-bold">HSDEC Global Finance</button>
                    <button onClick={()=>{setMode('korea'); setTarget('ຊຸດທີ 2'); fetchData('korea', 'ຊຸດທີ 2');}} className="w-full max-w-sm p-8 bg-indigo-600 text-white rounded-3xl font-bold">Sessional Worker Korea</button>
                </div>
            );

            return (
                <div className="flex h-screen">
                    <div className="w-80 bg-white border-r overflow-y-auto">
                        <div className="p-4 bg-slate-50 border-b font-bold flex justify-between items-center">
                            <span>{target}</span>
                            <button onClick={handleNew} className="bg-blue-600 text-white px-3 py-1 rounded">+</button>
                        </div>
                        {records.map((r, i) => (
                            <div key={i} onClick={()=>{setSelected(r); setIsEditing(false);}} className={`p-4 border-b cursor-pointer ${selected?.v[0] === r.v[0] ? 'list-active':''}`}>
                                <div className="text-xs text-slate-400">{r.v[1]}</div>
                                <div className="font-bold lao-text">{r.v[2]}</div>
                            </div>
                        ))}
                    </div>

                    <div className="flex-1 p-6 overflow-y-auto">
                        {isEditing ? (
                            <div className="bg-white p-6 rounded-2xl shadow">
                                <h2 className="font-bold mb-4 text-lg">Register / Edit Entry</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <input className="border p-2 rounded" placeholder="No" value={formData.no} readOnly />
                                    <input className="border p-2 rounded" type="date" value={formData.date} onChange={e=>updateField('date', e.target.value)} />
                                    <input className="border p-2 rounded col-span-2" placeholder="Item Name" value={formData.item || ''} onChange={e=>updateField('item', e.target.value)} />
                                    <select className="border p-2 rounded" value={formData.currency} onChange={e=>updateField('currency', e.target.value)}>
                                        <option>LAK</option><option>USD</option><option>THB</option>
                                    </select>
                                    <input className="border p-2 rounded" placeholder="Quantity" type="number" value={formData.qty} onChange={e=>updateField('qty', e.target.value)} />
                                    <input className="border p-2 rounded" placeholder="Price" type="number" value={formData.price} onChange={e=>updateField('price', e.target.value)} />
                                    <div className="col-span-2 p-3 bg-indigo-50 rounded font-bold text-indigo-700">Total: {Number(formData.total).toLocaleString()}</div>
                                    <input type="file" accept="image/*" capture="environment" className="col-span-2" onChange={e=>{
                                        const reader = new FileReader();
                                        reader.onload = ev => updateField('photo', ev.target.result);
                                        reader.readAsDataURL(e.target.files[0]);
                                    }} />
                                </div>
                                <button onClick={saveRecord} className="mt-6 w-full bg-green-600 text-white py-3 rounded-xl font-bold">Save Record</button>
                            </div>
                        ) : selected ? (
                            <div className="bg-white p-6 rounded-2xl shadow space-y-3">
                                <h2 className="text-xl font-bold border-b pb-2">No.{selected.v[0]}</h2>
                                <p><strong>Date:</strong> {selected.v[1]}</p>
                                <p className="lao-text"><strong>Item:</strong> {selected.v[2]}</p>
                                <p><strong>Quantity:</strong> {selected.v[3]}</p>
                                <p><strong>Total:</strong> {Number(selected.v[11]).toLocaleString()}</p>
                                {selected.v[13] && <img src={selected.v[13]} className="max-w-xs border rounded" />}
                                <button onClick={()=>{setFormData({no: selected.v[0], date: selected.v[1], item: selected.v[2], qty: selected.v[3], total: selected.v[11]}); setIsEditing(true);}} className="bg-amber-500 text-white px-6 py-2 rounded">Edit</button>
                            </div>
                        ) : <div className="text-slate-400">Please select an entry.</div>}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
