<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Management</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx2hA6aPsAC8ucpNId_Nv1pFti9eJE7mW7G3n6l0a8KogIUNq_hSQDljXv4-nc3VVy4RQ/exec';

        function FinanceApp() {
            const [records, setRecords] = useState([]);
            const [selected, setSelected] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [formData, setFormData] = useState({});

            const fetchData = async () => {
                const res = await fetch(GAS_URL + "?mode=hsdec&target=ເດືອນ 1");
                const data = await res.json();
                setRecords(data);
            };

            useEffect(() => { fetchData(); }, []);

            // 新規作成時：A列の最大値+1を自動セット
            const handleNew = () => {
                const nextNo = records.length > 0 ? Math.max(...records.map(r => Number(r.v[0]) || 0)) + 1 : 1;
                setFormData({ no: nextNo, date: new Date().toISOString().split('T')[0], currency: 'LAK' });
                setSelected({ isNew: true });
                setIsEditing(true);
            };

            const saveRecord = async () => {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ ...formData, mode: 'hsdec', target: 'ເດືອນ 1' }) });
                setIsEditing(false);
                fetchData();
            };

            return (
                <div className="flex h-screen">
                    {/* 左リスト */}
                    <div className="w-1/3 bg-white border-r overflow-y-auto">
                        <button onClick={handleNew} className="w-full bg-blue-600 text-white p-4 font-bold">+ 新規追加</button>
                        {records.map((r, i) => (
                            <div key={i} onClick={() => { setSelected(r); setIsEditing(false); }} className="p-4 border-b cursor-pointer hover:bg-slate-50">
                                <div className="font-bold">{r.v[2]}</div>
                                <div className="text-sm text-slate-500">No. {r.v[0]} | {r.v[1]}</div>
                            </div>
                        ))}
                    </div>

                    {/* 右詳細/編集 */}
                    <div className="flex-1 p-8 overflow-y-auto">
                        {isEditing ? (
                            <div className="bg-white p-6 rounded-xl shadow-lg">
                                <h2 className="text-xl font-bold mb-4">編集 / 新規登録</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <input className="border p-2" value={formData.no} disabled placeholder="No" />
                                    <input className="border p-2" type="date" value={formData.date} onChange={e=>setFormData({...formData, date:e.target.value})} />
                                    <select className="border p-2" onChange={e=>setFormData({...formData, currency: e.target.value})}>
                                        <option value="LAK">LAK</option><option value="USD">USD</option><option value="THB">THB</option>
                                    </select>
                                    <input className="border p-2" placeholder="金額" onChange={e=>setFormData({...formData, amount:e.target.value})} />
                                    <input type="file" accept="image/*" capture="environment" onChange={e => {
                                        const reader = new FileReader();
                                        reader.onload = (ev) => setFormData({...formData, photo: ev.target.result});
                                        reader.readAsDataURL(e.target.files[0]);
                                    }} />
                                </div>
                                <button onClick={saveRecord} className="mt-6 w-full bg-green-600 text-white py-3 rounded-lg">保存</button>
                            </div>
                        ) : selected ? (
                            <div className="bg-white p-8 rounded-xl shadow-lg">
                                <h2 className="text-2xl font-bold mb-6">詳細情報</h2>
                                <div className="space-y-4">
                                    <p><strong>連番:</strong> {selected.v[0]}</p>
                                    <p><strong>日付:</strong> {selected.v[1]}</p>
                                    <p><strong>品名:</strong> {selected.v[2]}</p>
                                    <p><strong>合計:</strong> {selected.v[11]}</p>
                                    {selected.v[13] && <img src={selected.v[13]} className="w-64 border rounded" />}
                                    <button onClick={() => { setFormData(selected.v); setIsEditing(true); }} className="bg-amber-500 text-white px-6 py-2 rounded">編集する</button>
                                </div>
                            </div>
                        ) : <div className="text-center pt-20 text-slate-400">リストから項目を選択してください</div>}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FinanceApp />);
    </script>
</body>
</html>
