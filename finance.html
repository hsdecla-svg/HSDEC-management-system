<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSDEC Finance Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; height: 100vh; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .list-active { background: #eef2ff; border-right: 4px solid #4f46e5; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx2hA6aPsAC8ucpNId_Nv1pFti9eJE7mW7G3n6l0a8KogIUNq_hSQDljXv4-nc3VVy4RQ/exec';

        function App() {
            const [mode, setMode] = useState('portal'); // portal, hsdec, korea
            const [target, setTarget] = useState('');   // シート名
            const [records, setRecords] = useState([]);
            const [sel, setSel] = useState(null);
            const [edit, setEdit] = useState(false);
            const [loading, setLoading] = useState(false);

            // データ取得
            const fetchData = async (m, t) => {
                setLoading(true);
                try {
                    const res = await fetch(`${GAS_URL}?mode=${m}&target=${encodeURIComponent(t)}`);
                    const json = await res.json();
                    setRecords(json);
                } catch(e) { alert("Load error"); }
                setLoading(false);
            };

            // 新規作成用フォーム初期値
            const createNew = () => ({
                no: "", date: new Date().toISOString().split('T')[0], item: "", qty: "",
                usd1: 0, thb1: 0, lak1: 0, usd2: 0, thb2: 0, lak2: 0, rate: 0,
                total: 0, payment: "Cash", photo: ""
            });

            // 保存処理
            const save = async () => {
                setLoading(true);
                await fetch(GAS_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ ...sel, mode, target }) 
                });
                setEdit(false);
                fetchData(mode, target);
            };

            // 画面分岐
            if (mode === 'portal') return (
                <div className="h-full flex flex-col items-center justify-center gap-4">
                    <button onClick={()=>{setMode('hsdec'); setTarget('ເດືອນ 1'); fetchData('hsdec', 'ເດືອນ 1');}} className="p-10 bg-slate-800 text-white rounded-3xl">会社全体会計</button>
                    <button onClick={()=>{setMode('korea'); setTarget('ຊຸດທີ 2'); fetchData('korea', 'ຊຸດທີ 2');}} className="p-10 bg-blue-600 text-white rounded-3xl">Sessional Worker</button>
                </div>
            );

            return (
                <div className="flex h-full">
                    {/* サイドバー */}
                    <div className="w-80 bg-white border-r overflow-y-auto">
                        <div className="p-4 border-b font-bold flex justify-between">
                            {target} <button onClick={()=>{setSel(createNew()); setEdit(true);}} className="bg-green-500 text-white px-2 rounded">+</button>
                        </div>
                        {records.map(r => (
                            <div key={r.row_index} onClick={()=>setSel(r)} className={`p-4 border-b cursor-pointer ${sel?.row_index === r.row_index ? 'list-active':''}`}>
                                <div className="text-xs text-slate-400">{r.v[1]}</div>
                                <div className="font-bold">{r.v[2]}</div>
                                <div className="text-sm">LAK: {r.v[6]}</div>
                            </div>
                        ))}
                    </div>

                    {/* 詳細/編集 */}
                    <div className="flex-1 p-6 overflow-y-auto">
                        {sel ? (
                            <div className="bg-white p-6 rounded-2xl shadow-sm">
                                <div className="grid grid-cols-2 gap-4">
                                    <input className="border p-2" type="date" value={sel.v ? sel.v[1] : sel.date} onChange={e=>setSel({...sel, date:e.target.value})} />
                                    <input className="border p-2" placeholder="品名" value={sel.v ? sel.v[2] : sel.item} onChange={e=>setSel({...sel, item:e.target.value})} />
                                    <input className="border p-2" placeholder="数量" value={sel.v ? sel.v[3] : sel.qty} onChange={e=>setSel({...sel, qty:e.target.value})} />
                                    <input className="border p-2" placeholder="合計金額(LAK)" value={sel.v ? sel.v[6] : sel.lak1} onChange={e=>setSel({...sel, lak1:e.target.value})} />
                                </div>
                                <button onClick={save} className="mt-4 w-full bg-blue-600 text-white py-3 rounded-xl font-bold">保存する</button>
                            </div>
                        ) : <div>選択してください</div>}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
