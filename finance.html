<script type="text/babel">
    const { useState, useEffect } = React;

    // ここにそれぞれのGAS URLを入れてください
    const GAS_URLS = {
        hsdec: 'https://script.google.com/macros/s/AKfycbzqkRs7gx6HA0yTVeNmul-0fY1Xx0FFeLP4c-A4gc4W5kskL1E72WvzKk2WGuiHF4S1ww/exec',
        korea: 'https://script.google.com/macros/s/（労働者用のID）/exec'
    };

    function App() {
        const [mode, setMode] = useState('hsdec'); // デフォルトを会社全体に設定
        const [target, setTarget] = useState('ເດືອນ 1');
        const [records, setRecords] = useState([]);

        // URLをモードに応じて切り替える
        const fetchData = async (m, t) => {
            const url = GAS_URLS[m];
            const script = document.createElement('script');
            const cb = 'cb_' + Math.floor(Math.random() * 1000000);
            
            window[cb] = (data) => {
                setRecords(Array.isArray(data) ? data : []);
                delete window[cb];
                document.body.removeChild(script);
            };
            
            script.src = `${url}?target=${encodeURIComponent(t)}&callback=${cb}`;
            document.body.appendChild(script);
        };

        // モードかターゲットが変わったら再取得
        useEffect(() => { fetchData(mode, target); }, [mode, target]);

        return (
            <div className="h-screen flex flex-col">
                {/* ログインページには影響しない、finance専用の切り替えタブ */}
                <div className="flex bg-slate-900 p-2 gap-2">
                    <button onClick={() => setMode('hsdec')} 
                            className={`px-6 py-2 rounded-lg ${mode === 'hsdec' ? 'bg-emerald-600' : 'bg-slate-700'}`}>
                        HSDEC Finance
                    </button>
                    <button onClick={() => setMode('korea')} 
                            className={`px-6 py-2 rounded-lg ${mode === 'korea' ? 'bg-indigo-600' : 'bg-slate-700'}`}>
                        Worker Finance
                    </button>
                </div>

                {/* 以下、既存の表示ロジック（そのまま） */}
                <div className="flex-1 p-6 overflow-y-auto">
                    {/* ...ここから下は変更なし... */}
                </div>
            </div>
        );
    }
    // ...render処理...
</script>
