<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSDEC Global Hub - Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.10/index.global.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #0f172a; font-family: 'Inter', sans-serif; color: white; overflow-x: hidden; }
        
        /* メニューカードのホバーアニメーション */
        .menu-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .menu-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-8px);
            border-color: #10b981;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* カレンダーの見た目調整（ログイン画面用） */
        .fc { border: none !important; font-size: 11px; }
        .fc-theme-standard td, .fc-theme-standard th { border: 1px solid rgba(255, 255, 255, 0.1) !important; }
        .fc-col-header-cell-cushion { color: #94a3b8; font-weight: 900; text-transform: uppercase; }
        .fc-daygrid-day-frame { min-height: 45px !important; }
        .fc-daygrid-event-harness { display: none !important; }
        .has-event::after {
            content: ''; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981;
        }
        .fc-toolbar-title { font-size: 16px !important; font-weight: 900 !important; color: #10b981; }
        .fc-button { background: transparent !important; border: none !important; color: #64748b !important; font-weight: 900 !important; }

        #eventModal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); align-items: center; justify-content: center; }
        
        /* 画面モードタブのカスタムスタイル */
        .tab-active { background: #10b981; color: white; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 text-white">

    <div id="auth-section" class="w-full max-w-md space-y-6">
        <div class="text-center">
            <h1 class="text-5xl font-black italic text-emerald-500 tracking-tighter">HSDEC</h1>
            <p class="text-slate-500 font-black uppercase tracking-[0.3em] text-[10px] mt-2">Central Management System</p>
        </div>
        
        <div class="bg-white/5 rounded-[2.5rem] p-4 border border-white/10 shadow-2xl">
            <div id="calendar"></div>
        </div>

        <div class="bg-white/5 p-8 rounded-[2.5rem] border border-white/10 shadow-2xl space-y-4">
            
            <div>
                <label class="block text-[10px] font-black text-slate-500 uppercase mb-2 tracking-widest">Select Layout Mode</label>
                <div class="grid grid-cols-2 bg-slate-800 p-1 rounded-2xl border border-white/5">
                    <button id="mode-pc" onclick="setScreenMode('pc')" class="py-3 rounded-xl font-black text-xs uppercase tracking-wider transition-all tab-active">💻 PC Mode</button>
                    <button id="mode-mobile" onclick="setScreenMode('mobile')" class="py-3 rounded-xl font-black text-xs uppercase tracking-wider transition-all text-slate-400">📱 Mobile Mode</button>
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-500 uppercase mb-2 tracking-widest">Select User</label>
                <select id="user-select" class="w-full bg-slate-800 border-none p-4 rounded-xl text-white font-bold outline-none">
                    <option value="Takashi">Takashi (Admin)</option>
                    <option value="Chansouk">Chansouk (Staff)</option>
                    <option value="Mim">Mim (Staff)</option>
                    <option value="Chanthaviphone">Chanthaviphone (VV)</option>
                    <option value="Sengmala">Sengmala (SV)</option>
                    <option value="Guest">Guest</option>
                </select>
            </div>

            <div>
                <input type="password" id="pass" placeholder="••••••••" class="w-full bg-slate-800 border-none p-5 rounded-2xl text-white text-center text-2xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <button onclick="login()" class="w-full bg-emerald-500 text-white py-5 rounded-2xl font-black text-lg shadow-xl shadow-emerald-500/20 active:scale-95 transition-all uppercase tracking-widest">Enter System</button>
            <p id="error" class="text-rose-500 text-xs mt-6 text-center hidden font-black uppercase tracking-widest italic">Access Denied.</p>
        </div>
    </div>

    <div id="menu-section" class="w-full max-w-5xl hidden flex flex-col space-y-12 py-10">
        <div class="flex justify-between items-end px-4">
            <div>
                <h2 class="text-5xl font-black italic tracking-tighter text-white uppercase">Control Hub</h2>
                <div class="flex gap-4 mt-2">
                    <p id="welcome-msg" class="text-emerald-500 font-black uppercase text-[10px] tracking-widest">Logged in</p>
                    <p id="current-mode-msg" class="text-blue-400 font-black uppercase text-[10px] tracking-widest">MODE: PC</p>
                </div>
            </div>
            <button onclick="location.reload()" class="text-[10px] font-black text-slate-500 hover:text-white uppercase border border-slate-700 px-6 py-3 rounded-full transition">Logout</button>
        </div>
        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 px-4">
            </div>
    </div>

    <div id="eventModal" onclick="this.style.display='none'">
        <div class="bg-slate-900 border border-emerald-500/30 rounded-[2.5rem] p-8 w-[85%] max-w-xs text-center" onclick="event.stopPropagation()">
            <h3 id="modalTitle" class="text-xl font-black text-white mb-2 italic uppercase"></h3>
            <p id="modalDate" class="text-[10px] font-bold text-emerald-500 mb-6 tracking-widest"></p>
            <div id="modalDesc" class="text-xs text-slate-400 mb-8 text-left border-t border-white/10 pt-4 max-h-[200px] overflow-y-auto"></div>
            <button onclick="document.getElementById('eventModal').style.display='none'" class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-black text-[12px] uppercase">Close</button>
        </div>
    </div>

    <script>
        const CALENDAR_ID = 'hsdec.la@gmail.com';
        const API_KEY = 'AIzaSyCzE9RsYu1ec6_b0ePHj_7FEOh9aF0fQi0';

        const USER_DB = {
            "Takashi": { pw: "Tks83446412", role: "admin" },
            "Chansouk": { pw: "97372185", role: "staff" },
            "Mim": { pw: "78277996", role: "staff" },
            "Chanthaviphone": { pw: "96086112", role: "vv" },
            "Sengmala": { pw: "22886998", role: "sv" },
            "Guest": { pw: "HSDEC2025", role: "guest" }
        };

        let mainCalendar;
        let selectedScreenMode = 'pc'; // デフォルトはPCモード

        window.onload = function() { initCalendar(); };

        // モード切替の関数
        function setScreenMode(mode) {
            selectedScreenMode = mode;
            const pcBtn = document.getElementById('mode-pc');
            const mobileBtn = document.getElementById('mode-mobile');
            
            if (mode === 'pc') {
                pcBtn.className = "py-3 rounded-xl font-black text-xs uppercase tracking-wider transition-all tab-active";
                mobileBtn.className = "py-3 rounded-xl font-black text-xs uppercase tracking-wider transition-all text-slate-400";
            } else {
                pcBtn.className = "py-3 rounded-xl font-black text-xs uppercase tracking-wider transition-all text-slate-400";
                mobileBtn.className = "py-3 rounded-xl font-black text-xs uppercase tracking-wider transition-all tab-active";
            }
        }

        function initCalendar() {
            mainCalendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth',
                googleCalendarApiKey: API_KEY,
                events: { googleCalendarId: CALENDAR_ID },
                headerToolbar: { left: 'prev', center: 'title', right: 'next' },
                height: 'auto',
                eventDidMount: (info) => {
                    const dayEl = info.el.closest('.fc-daygrid-day');
                    if (dayEl) {
                        dayEl.classList.add('has-event');
                        dayEl.onclick = () => showModal(info.event);
                    }
                }
            });
            mainCalendar.render();
        }

        function showModal(event) {
            document.getElementById('modalTitle').innerText = event.title;
            document.getElementById('modalDate').innerText = event.start.toLocaleDateString();
            document.getElementById('modalDesc').innerText = event.extendedProps.description || 'No details.';
            document.getElementById('eventModal').style.display = 'flex';
        }

        function login() {
            const name = document.getElementById('user-select').value;
            const pass = document.getElementById('pass').value;
            if (USER_DB[name] && USER_DB[name].pw === pass) {
                showMenu(name, USER_DB[name].role);
            } else {
                document.getElementById('error').classList.remove('hidden');
                setTimeout(() => { document.getElementById('error').classList.add('hidden'); }, 2000);
            }
        }

        function showMenu(name, role) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('menu-section').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = `IDENTIFIED AS: ${name} / ROLE: ${role.toUpperCase()}`;
            document.getElementById('current-mode-msg').innerText = `MODE: ${selectedScreenMode.toUpperCase()}`;
            
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = ''; 
            
            const allMenus = [
                { title: 'Timeline', desc: 'HISTORY & SCHEDULE', icon: '⏳', url: 'timeline.html', roles: ['admin', 'staff', 'sv', 'vv', 'guest'] },
                { title: 'Workers', desc: 'DATABASE MANAGEMENT', icon: '👤', url: 'worker.html', roles: ['admin', 'staff', 'sv', 'vv', 'guest'] },
                { title: 'Calendar Edit', desc: 'SCHEDULE OVERRIDE', icon: '📅', url: 'calendar_edit.html', roles: ['admin', 'staff'] },
                { title: 'Finance', desc: 'ACCOUNTING SYSTEM', icon: '💰', url: 'finance.html', roles: ['admin', 'staff'] },
                { title: 'Diary', desc: 'DAILY FIELD REPORTS', icon: '📝', url: 'diary.html', roles: ['admin', 'staff', 'sv'] },
                { title: 'Contracts', desc: 'DOCUMENT ARCHIVE', icon: '📄', url: 'contracts.html', roles: ['admin', 'staff'] },
                { title: 'Cloud', desc: 'GOOGLE DRIVE LINK', icon: '📸', url: 'https://drive.google.com/', roles: ['admin', 'staff', 'sv', 'vv'] }
            ];

            allMenus.forEach(m => {
                if (m.roles.includes(role)) {
                    const card = document.createElement('div');
                    card.className = "menu-card p-10 rounded-[2.5rem] cursor-pointer group";
                    
                    // 外部サイト（Googleドライブ等）以外は、末尾に「?mode=pc」または「?mode=mobile」をつけて遷移させる
                    if (m.url.startsWith('http')) {
                        card.onclick = () => window.open(m.url, '_blank');
                    } else {
                        card.onclick = () => location.href = `${m.url}?mode=${selectedScreenMode}`;
                    }
                    
                    card.innerHTML = `<div class="text-4xl mb-4 group-hover:scale-110 transition-transform">${m.icon}</div><h3 class="text-2xl font-black tracking-tight uppercase italic">${m.title}</h3><p class="text-slate-500 text-[10px] mt-3 font-bold uppercase tracking-widest">${m.desc}</p>`;
                    grid.appendChild(card);
                }
            });
        }
    </script>
</body>
</html>
