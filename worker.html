        const getBatch = (no) => {
            if (!no || typeof no !== 'string') return "Unknown";
            const parts = no.split('-');
            return parts.length > 1 ? `第${parts[1].substring(0, 2)}期生` : "その他";
        };

        // 以前の extract/fix/clean ロジックは全てそのまま引き継いでいます
        const strictExtract = (rawRow, field) => {
            const idx = STRICT_MATRIX[field];
            return rawRow[idx] !== undefined ? String(rawRow[idx]).trim() : "";
        };
