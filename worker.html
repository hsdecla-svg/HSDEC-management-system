<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSDEC System - Lao Passport Optimized</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Phetsarath:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; height: 100vh; overflow: hidden; font-size: 13px; }
        .lao-text { font-family: 'Phetsarath OT', 'Phetsarath', sans-serif; }
        .mrz-font { font-family: 'Courier New', Courier, monospace; letter-spacing: 0.05em; }
        input, select { border: 1px solid #e2e8f0 !important; }
        .list-item-active { background-color: #f0fdf4; border-right: 3px solid #10b981; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        window.loadTesseract = function() {
            if (window.Tesseract) return Promise.resolve();
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
                s.onload = resolve;
                document.head.appendChild(s);
            });
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzvHbVjc_1XaVT54dkLTfWlIccAoUWsiERzPbOSnPSvLMazkitGOTzkim7hcHzxrRP9gQ/exec';
        
        const FIELD_GROUPS = {
            basic: ['ລໍາດັບ', 'ສະຖານະ', 'Re-entry', 'Full Name', 'ຊື່ ແລະ ນາມສະກຸນ', 'Sex', 'Date of birth', 'Age', 'Size'],
            passport: ['Passport No.', 'Date of issue', 'Date of Expiry'],
            address: ['Village', 'District', 'Province', 'Google drive']
        };

        const fixPassportNo = (raw) => {
            if (!raw) return "";
            // スペースや記号を除去し大文字へ
            let clean = raw.toUpperCase().replace(/[\s<]/g, '');
            // Pから始まる8〜9桁を想定。読み取りミス（PAO -> PA0など）を補正
            let body = clean.startsWith('P') ? clean.substring(1) : clean;
            body = body.replace(/[GQKOD]/g, '0').replace(/I/g, '1').replace(/S/g, '5');
            return 'P' + body.substring(0, 7); // P + 数字7桁に強制
        };

        const cleanName = (text) => {
            if (!text) return "";
            let name = text.split('<<<')[0].replace(/<+/g, ' ').trim();
            return name.split(/[CKLS]{3,}/)[0].trim(); // ノイズ除去
        };

        function App() {
            const [workers, setWorkers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedBatch, setSelectedBatch] = useState(null);
            const [selectedWorker, setSelectedWorker] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [isScanning, setIsScanning] = useState(false);
            const [scanStatus, setScanStatus] = useState("");
            const [masterOptions, setMasterOptions] = useState({ provinces: [], provinceMap: {}, Sex: [], Status: [], Size: [] });

            useEffect(() => { fetchData(); }, []);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await fetch(GAS_URL);
                    const json = await res.json();
                    setWorkers(json.workers || []);
                    setMasterOptions(json.options || {});
                    const batches = [...new Set((json.workers || []).map(w => w.batch || w._sheetName?.replace("Batch","")))].sort((a,b)=>a-b);
                    if (batches.length > 0 && !selectedBatch) setSelectedBatch(batches[0]);
                } catch (e) { console.error(e); }
                setLoading(false);
            };

            const filteredWorkers = useMemo(() => {
                return workers.filter(w => (w.batch || w._sheetName?.replace("Batch","")) == selectedBatch)
                    .filter(w => {
                        const s = `${w['Full Name']} ${w['ຊື່ ແລະ ນາມສະກຸນ']} ${w['Passport No.']}`.toLowerCase();
                        return s.includes(searchQuery.toLowerCase());
                    }).sort((a,b) => (a['ລໍາດັບ'] || 0) - (b['ລໍາດັບ'] || 0));
            }, [workers, selectedBatch, searchQuery]);

            const handlePassportScan = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsScanning(true);
                setScanStatus("OCR Processing...");
                
                try {
                    await window.loadTesseract();
                    const workerOCR = await Tesseract.createWorker(['eng']);
                    const img = new Image();
                    img.src = URL.createObjectURL(file);
                    await new Promise(r => img.onload = r);
                    
                    const { data: { text } } = await workerOCR.recognize(img);
                    await workerOCR.terminate();
                    
                    const mrzLines = text.split('\n').map(l => l.trim().replace(/\s/g, '')).filter(l => l.length >= 30);

                    if (mrzLines.length >= 2) {
                        const line1 = mrzLines[mrzLines.length - 2];
                        const line2 = mrzLines[mrzLines.length - 1];
                        let ext = { ...selectedWorker };

                        // 1. Passport No (Force P + 7 digits)
                        ext['Passport No.'] = fixPassportNo(line2.substring(0, 9));

                        // 2. Name
                        ext['Full Name'] = cleanName(line1.substring(5));

                        // 3. Birth & Sex
                        const dob = line2.substring(13, 19);
                        const yr = parseInt(dob.substring(0,2)) < 50 ? `20${dob.substring(0,2)}` : `19${dob.substring(0,2)}`;
                        ext['Date of birth'] = `${yr}-${dob.substring(2,4)}-${dob.substring(4,6)}`;
                        ext['Sex'] = line2[20] === 'M' ? 'M' : (line2[20] === 'F' ? 'F' : '');

                        // 4. Expiry & Issue (10 Years + 1 Day Rule)
                        const expRaw = line2.substring(21, 27);
                        const expiry = `20${expRaw.substring(0,2)}-${expRaw.substring(2,4)}-${expRaw.substring(4,6)}`;
                        ext['Date of Expiry'] = expiry;

                        if (expiry) {
                            const d = new Date(expiry);
                            // 一律10年戻して1日足す
                            let issue = new Date(d.getFullYear() - 10, d.getMonth(), d.getDate());
                            issue.setDate(issue.getDate() + 1);
                            ext['Date of issue'] = issue.toISOString().split('T')[0];
                        }

                        setSelectedWorker(ext);
                        setScanStatus("Done!");
                    }
                } catch (err) { alert("Scan Failed"); }
                setIsScanning(false);
            };

            const handleSave = async () => {
                setIsEditing(false); // UI先行反映
                try {
                    const payload = { ...selectedWorker, action: selectedWorker._row ? "update" : "addNew", batch: selectedBatch };
                    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                    fetchData();
                } catch (e) { alert("Save Error"); }
            };

            const renderField = (field) => {
                const isDate = field.includes('Date') || field.includes('Expiry');
                const val = selectedWorker[field];
                const isLao = ['ຊື່ ແລະ ນາມສະກຸນ', 'Village', 'District', 'Province'].includes(field);

                if (!isEditing) return (
                    <div key={field} className="border-b border-slate-100 py-1.5 flex justify-between">
                        <span className="text-[10px] text-slate-400 font-bold uppercase">{field}</span>
                        <span className={`font-semibold ${isLao ? 'lao-text text-sm' : ''}`}>
                            {isDate ? (val ? new Date(val).toLocaleDateString('en-GB') : '-') : String(val || '-')}
                        </span>
                    </div>
                );

                return (
                    <div key={field} className="mb-2">
                        <label className="text-[10px] font-bold text-slate-500 uppercase">{field}</label>
                        <input className={`w-full p-1 text-xs rounded border ${isLao ? 'lao-text' : ''}`} 
                               type={isDate ? 'date' : 'text'} 
                               value={isDate ? (val ? String(val).split('T')[0] : '') : (val || '')}
                               onChange={e => setSelectedWorker({...selectedWorker, [field]: e.target.value})} />
                    </div>
                );
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-bold text-emerald-600">HSDEC SYSTEM LOADING...</div>;

            return (
                <div className="flex h-screen w-screen overflow-hidden">
                    <div className="w-72 bg-white border-r flex flex-col shadow-sm">
                        <div className="p-3 border-b bg-slate-50 space-y-2">
                            <select className="w-full p-1.5 text-xs font-bold rounded border" value={selectedBatch || ''} onChange={e => setSelectedBatch(e.target.value)}>
                                {[...new Set(workers.map(w => w.batch || w._sheetName?.replace("Batch","")))].sort((a,b)=>a-b).map(n => <option key={n} value={n}>BATCH {n}</option>)}
                            </select>
                            <input type="text" placeholder="Search..." className="w-full p-1.5 text-xs rounded border" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                        </div>
                        <div className="flex-grow overflow-y-auto custom-scrollbar">
                            {filteredWorkers.map((w, i) => (
                                <div key={i} onClick={() => { setSelectedWorker(w); setIsEditing(false); }} className={`p-3 border-b cursor-pointer ${selectedWorker?._row === w._row ? 'list-item-active' : ''}`}>
                                    <div className="text-emerald-600 font-bold text-xs">{w['Full Name']}</div>
                                    <div className="text-slate-500 lao-text text-sm truncate">{w['ຊື່ ແລະ ນາມສະກຸນ']}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="flex-grow bg-slate-50 relative flex flex-col">
                        {isScanning && <div className="absolute inset-0 bg-slate-900/60 z-50 flex items-center justify-center text-white font-bold">{scanStatus}</div>}
                        {selectedWorker ? (
                            <>
                                <div className="bg-white border-b px-6 py-3 flex justify-between items-center shadow-sm">
                                    <div>
                                        <div className="text-xl font-black text-slate-800">{selectedWorker['Full Name']}</div>
                                        <div className="text-emerald-600 lao-text text-lg">{selectedWorker['ຊື່ ແລະ ນາມສະກຸນ']}</div>
                                    </div>
                                    <div className="flex gap-2">
                                        {isEditing ? (
                                            <>
                                                <label className="bg-emerald-600 text-white px-4 py-2 rounded font-bold text-[11px] cursor-pointer">📷 SCAN<input type="file" accept="image/*" className="hidden" onChange={handlePassportScan} /></label>
                                                <button onClick={handleSave} className="bg-slate-900 text-white px-6 py-2 rounded font-bold text-[11px]">SAVE</button>
                                            </>
                                        ) : <button onClick={() => setIsEditing(true)} className="bg-white border px-5 py-2 rounded font-bold text-[11px]">EDIT</button>}
                                    </div>
                                </div>
                                <div className="p-6 grid grid-cols-2 gap-6 overflow-y-auto">
                                    <div className="bg-white p-5 rounded-xl border shadow-sm">{FIELD_GROUPS.basic.map(f => renderField(f))}</div>
                                    <div className="bg-white p-5 rounded-xl border shadow-sm">{FIELD_GROUPS.passport.map(f => renderField(f))}</div>
                                </div>
                            </>
                        ) : <div className="m-auto text-slate-300 font-bold text-2xl">SELECT WORKER</div>}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
