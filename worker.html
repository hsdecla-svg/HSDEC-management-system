<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSDEC Management - High Density</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; height: 100vh; overflow: hidden; font-size: 13px; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input, select { border: 1px solid #e2e8f0 !important; }
        .list-item-active { background-color: #f0fdf4; border-right: 3px solid #10b981; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        window.loadTesseract = function() {
            if (window.Tesseract) return Promise.resolve();
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
                s.onload = resolve;
                document.head.appendChild(s);
            });
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzvHbVjc_1XaVT54dkLTfWlIccAoUWsiERzPbOSnPSvLMazkitGOTzkim7hcHzxrRP9gQ/exec';
        
        const FIELD_GROUPS = {
            basic: ['ລໍາດັບ', 'ສະຖານະ', 'Re-entry', 'Full Name', 'ຊື່ ແລະ ນາມສະກຸນ', 'Sex', 'Date of birth', 'Age', 'Size'],
            passport: ['Passport No.', 'Date of issue', 'Date of Expiry'],
            address: ['Village', 'District', 'Province', 'Google drive']
        };

        function App() {
            const [workers, setWorkers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedBatch, setSelectedBatch] = useState(null);
            const [selectedWorker, setSelectedWorker] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [isScanning, setIsScanning] = useState(false);
            const [masterOptions, setMasterOptions] = useState({ provinces: [], provinceMap: {}, Sex: [], Status: [], Size: [] });

            useEffect(() => { fetchData(); }, []);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await fetch(GAS_URL);
                    const json = await res.json();
                    setWorkers(json.workers || []);
                    setMasterOptions(json.options || { provinces: [], provinceMap: {}, Sex: [], Status: [], Size: [] });
                    const batches = [...new Set((json.workers || []).map(w => w.batch || w._sheetName?.replace("Batch","")))].sort((a,b)=>a-b);
                    if (batches.length > 0 && !selectedBatch) setSelectedBatch(batches[0]);
                } catch (e) { console.error(e); }
                setLoading(false);
            };

            const filteredWorkers = useMemo(() => {
                return workers
                    .filter(w => (w.batch || w._sheetName?.replace("Batch","")) == selectedBatch)
                    .filter(w => {
                        const searchStr = `${w['Full Name']} ${w['ຊື່ ແລະ ນາມສະກຸນ']} ${w['Passport No.']}`.toLowerCase();
                        return searchStr.includes(searchQuery.toLowerCase());
                    }).sort((a,b) => (a['ລໍາດັບ'] || 0) - (b['ລໍາດັບ'] || 0));
            }, [workers, selectedBatch, searchQuery]);

            const handlePassportScan = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsScanning(true);
                try {
                    await window.loadTesseract();
                    const workerOCR = await Tesseract.createWorker('eng');
                    const { data: { text } } = await workerOCR.recognize(file);
                    await workerOCR.terminate();
                    const cleanText = text.toUpperCase().replace(/ /g, '');
                    const lines = cleanText.split('\n').filter(l => l.length >= 30);
                    if (lines.length >= 2) {
                        const line1 = lines[lines.length - 2];
                        const line2 = lines[lines.length - 1];
                        const namePart = line1.substring(5);
                        const parts = namePart.split('<<');
                        const surname = parts[0]?.replace(/<+/g, ' ').trim() || "";
                        const givenName = parts[1]?.replace(/<+/g, ' ').trim() || "";
                        const passportNo = line2.substring(0, 9).replace(/</g, '');
                        const rawBirth = line2.substring(13, 19);
                        const birthYear = parseInt(rawBirth.substring(0, 2)) > 30 ? "19" + rawBirth.substring(0, 2) : "20" + rawBirth.substring(0, 2);
                        const rawExpiry = line2.substring(21, 27);
                        const expYear = 2000 + parseInt(rawExpiry.substring(0, 2));

                        const updated = { ...selectedWorker };
                        updated['Full Name'] = `${surname} ${givenName}`.trim();
                        updated['Passport No.'] = passportNo;
                        updated['Date of birth'] = `${birthYear}-${rawBirth.substring(2, 4)}-${rawBirth.substring(4, 6)}`;
                        updated['Date of Expiry'] = `${expYear}-${rawExpiry.substring(2, 4)}-${rawExpiry.substring(4, 6)}`;
                        updated['Date of issue'] = `${expYear - 10}-${rawExpiry.substring(2, 4)}-${rawExpiry.substring(4, 6)}`;
                        updated['Age'] = new Date().getFullYear() - parseInt(birthYear);
                        setSelectedWorker(updated);
                    }
                } catch (err) { alert("Scan fail"); } finally { setIsScanning(false); }
            };

            const handleSave = async () => {
                setIsSaving(true);
                try {
                    const payload = { ...selectedWorker, action: selectedWorker._row ? "update" : "addNew", batch: selectedBatch };
                    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                    await fetchData();
                    setIsEditing(false);
                } catch (e) { alert("Save Error"); }
                setIsSaving(false);
            };

            const renderField = (field) => {
                const isDate = field.includes('Date') || field.includes('Expiry');
                const value = selectedWorker[field];
                
                if (!isEditing) {
                    return (
                        <div key={field} className="border-b border-slate-100 py-1 flex justify-between items-center">
                            <span className="text-[10px] text-slate-400 font-bold uppercase">{field}</span>
                            <span className="font-semibold text-slate-700">
                                {field === 'Google drive' ? <a href={value} target="_blank" className="text-blue-500">Open ↗</a> : 
                                 isDate ? (value ? new Date(value).toLocaleDateString() : '-') : String(value || '-')}
                            </span>
                        </div>
                    );
                }

                return (
                    <div key={field} className="flex flex-col mb-2">
                        <label className="text-[10px] font-bold text-slate-500 uppercase mb-0.5">{field}</label>
                        {field === 'Sex' || field === 'ສະຖານະ' || field === 'Size' || field === 'Province' || field === 'District' ? (
                            <select className="p-1 text-xs rounded bg-white w-full" value={value || ''}
                                onChange={e => {
                                    const v = e.target.value;
                                    if(field === 'Province') {
                                        const dists = masterOptions.provinceMap[v] || [];
                                        setSelectedWorker({...selectedWorker, Province: v, District: dists.length === 1 ? dists[0] : ''});
                                    } else {
                                        setSelectedWorker({...selectedWorker, [field]: v});
                                    }
                                }}>
                                <option value="">-</option>
                                {(field === 'Province' ? masterOptions.provinces : field === 'District' ? masterOptions.provinceMap[selectedWorker['Province']] || [] : masterOptions[field === 'Sex' ? 'Sex' : field === 'ສະຖານະ' ? 'Status' : 'Size'] || []).map(opt => <option key={opt} value={opt}>{opt}</option>)}
                            </select>
                        ) : field === 'Re-entry' ? (
                            <input type="checkbox" className="w-4 h-4" checked={value === true || value === 'TRUE'} onChange={e => setSelectedWorker({...selectedWorker, [field]: e.target.checked})} />
                        ) : (
                            <input className="p-1 text-xs rounded w-full" type={field === 'Age' || field === 'ລໍາດັບ' ? 'number' : isDate ? 'date' : 'text'}
                                value={isDate ? (value ? String(value).split('T')[0] : '') : (value || '')}
                                onChange={e => setSelectedWorker({...selectedWorker, [field]: e.target.value})} />
                        )}
                    </div>
                );
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-bold text-emerald-600">LOADING HSDEC SYSTEM...</div>;

            return (
                <div className="flex h-screen w-screen overflow-hidden">
                    {/* LEFT: SUPER SLIM LIST (240px) */}
                    <div className="w-64 bg-white border-r flex flex-col shadow-sm z-10">
                        <div className="p-2 border-b bg-slate-50 space-y-2">
                            <div className="flex gap-1">
                                <select className="flex-grow p-1 text-xs font-bold rounded border" value={selectedBatch || ''} onChange={e => {setSelectedBatch(e.target.value); setSelectedWorker(null);}}>
                                    {[...new Set(workers.map(w => w.batch || w._sheetName?.replace("Batch","")))].sort((a,b)=>a-b).map(num => (
                                        <option key={num} value={num}>BATCH {num}</option>
                                    ))}
                                </select>
                                <button onClick={() => { setSelectedWorker({batch: selectedBatch}); setIsEditing(true); }} className="bg-slate-800 text-white px-2 py-1 rounded text-[10px] font-bold">+ NEW</button>
                            </div>
                            <input type="text" placeholder="Quick search..." className="w-full p-1 text-xs rounded border" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                        </div>
                        <div className="flex-grow overflow-y-auto custom-scrollbar">
                            {filteredWorkers.map((w, i) => (
                                <div key={i} onClick={() => { setSelectedWorker(w); setIsEditing(false); }}
                                    className={`p-2 border-b cursor-pointer text-[11px] transition-all hover:bg-slate-50 ${selectedWorker?._row === w._row ? 'list-item-active' : ''}`}>
                                    <div className="flex justify-between font-bold">
                                        <span className="text-slate-400">#{w['ລໍາດັບ']}</span>
                                        <span className="text-emerald-600">{w['Full Name']}</span>
                                    </div>
                                    <div className="text-slate-500 truncate">{w['ຊື່ ແລະ ນາມສະກຸນ']}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* RIGHT: COMPACT WORK AREA */}
                    <div className="flex-grow flex flex-col bg-slate-50 overflow-hidden relative">
                        {isScanning && <div className="absolute inset-0 bg-white/90 z-50 flex items-center justify-center font-bold text-emerald-600">AI SCANNING...</div>}
                        
                        {selectedWorker ? (
                            <>
                                {/* HEADER BAR */}
                                <div className="bg-white border-b px-4 py-2 flex justify-between items-center shadow-sm">
                                    <div className="flex items-center gap-4">
                                        <span className="text-lg font-black tracking-tighter">{selectedWorker['Full Name'] || 'NEW WORKER'}</span>
                                        <span className="text-emerald-600 font-bold">{selectedWorker['ຊື່ ແລະ ນາມສະກຸນ']}</span>
                                    </div>
                                    <div className="flex gap-2">
                                        {isEditing ? (
                                            <>
                                                <label className="bg-slate-100 px-3 py-1.5 rounded-lg font-bold text-[11px] cursor-pointer hover:bg-slate-200">
                                                    📷 SCAN PASSPORT
                                                    <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePassportScan} />
                                                </label>
                                                <button onClick={() => setIsEditing(false)} className="px-3 py-1.5 text-[11px] font-bold text-slate-500">CANCEL</button>
                                                <button onClick={handleSave} disabled={isSaving} className="bg-emerald-600 text-white px-4 py-1.5 rounded-lg font-bold text-[11px] shadow-md shadow-emerald-100">
                                                    {isSaving ? 'SAVING...' : 'SAVE CHANGES'}
                                                </button>
                                            </>
                                        ) : (
                                            <button onClick={() => setIsEditing(true)} className="bg-white border border-slate-300 px-4 py-1.5 rounded-lg font-bold text-[11px] shadow-sm hover:bg-slate-50">EDIT INFO</button>
                                        )}
                                    </div>
                                </div>

                                {/* FORM AREA (Single Screen, No Scroll if possible) */}
                                <div className="p-4 grid grid-cols-3 gap-4 h-full content-start overflow-y-auto custom-scrollbar">
                                    <div className="bg-white p-3 rounded-xl border shadow-sm h-fit">
                                        <h4 className="text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest border-b pb-1">Basic Profile</h4>
                                        {FIELD_GROUPS.basic.map(f => renderField(f))}
                                    </div>

                                    <div className="bg-white p-3 rounded-xl border shadow-sm h-fit">
                                        <h4 className="text-[10px] font-black text-emerald-500 uppercase mb-3 tracking-widest border-b pb-1">Passport Details</h4>
                                        {FIELD_GROUPS.passport.map(f => renderField(f))}
                                    </div>

                                    <div className="bg-white p-3 rounded-xl border shadow-sm h-fit">
                                        <h4 className="text-[10px] font-black text-blue-500 uppercase mb-3 tracking-widest border-b pb-1">Address & Links</h4>
                                        {FIELD_GROUPS.address.map(f => renderField(f))}
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="h-full flex items-center justify-center text-slate-300 font-bold uppercase tracking-widest text-xs">
                                Select a worker to view details
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
