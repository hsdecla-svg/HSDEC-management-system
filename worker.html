<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSDEC Management System - Advanced</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Phetsarath:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; height: 100vh; overflow: hidden; }
        .lao-text { font-family: 'Phetsarath OT', 'Phetsarath', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .list-item-active { background-color: #f0fdf4; border-right: 3px solid #10b981; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxkvDIaRxOlQGAebaqcnY8j1DVAcljwB-C6qm7Asn8SW5Yd3ss3-RGrp8kdMiDftKIXOg/exec';

        const FIELDS = [
            {key: 'id', label: 'ID'}, {key: 'no', label: 'ລໍາດັບ'}, {key: 'status', label: 'ສະຖານະ'},
            {key: 'reEntry', label: 'Re-entry'}, {key: 'laoName', label: 'ຊື່ ແລະ ນາມສະກຸນ'}, {key: 'engName', label: 'Full Name (Given Name Surname)'},
            {key: 'sex', label: 'Sex'}, {key: 'dob', label: 'Date of birth'}, {key: 'age', label: 'Age'},
            {key: 'passport', label: 'Passport No.'}, {key: 'dateOfIssue', label: 'Date of issue'},
            {key: 'dateOfExpiry', label: 'Date of Expiry'}, {key: 'village', label: 'Village'},
            {key: 'district', label: 'District'}, {key: 'province', label: 'Province'},
            {key: 'uniform', label: 'Uniform'}, {key: 'tel', label: 'TEL'},
            {key: 'departure', label: 'Departure'}, {key: 'smartphone', label: 'Smart phone'}, {key: 'bcel', label: 'BCEL ONE'}
        ];

        const getBatch = (no) => (String(no || "").includes('-')) ? `第${String(no).split('-')[1].substring(0, 2)}期生` : "その他";

        function App() {
            const [workers, setWorkers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isScanning, setIsScanning] = useState(false);
            const [selectedBatch, setSelectedBatch] = useState("ALL");
            const [selectedWorker, setSelectedWorker] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedDistrict, setSelectedDistrict] = useState("");
            const [isEditing, setIsEditing] = useState(false);
            const [editData, setEditData] = useState({});

            useEffect(() => { fetchData(); }, []);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const response = await fetch(GAS_URL);
                    const data = await response.json();
                    if (data && data.rows) setWorkers(data.rows);
                } catch (e) { console.error(e); } finally { setLoading(false); }
            };

            const handleEditStart = () => { 
                setEditData({ ...selectedWorker }); 
                setIsEditing(true); 
            };

            const handleInputChange = (key, value) => { 
                setEditData(prev => ({ ...prev, [key]: value })); 
            };

            const handleSave = async () => {
                const payload = { ...editData, action: "update", _row: editData._row };
                try {
                    await fetch(GAS_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify(payload) 
                    });
                    setIsEditing(false);
                    await fetchData();
                    // 更新されたデータを現在の選択中ワーカーにも反映
                    setSelectedWorker(editData);
                    alert("更新しました！");
                } catch (e) { 
                    console.error(e);
                    alert("保存に失敗しました。"); 
                }
            };

            // OCRスキャン処理
            const handlePassportScan = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsScanning(true);
                try {
                    const worker = await Tesseract.createWorker('eng');
                    const { data: { text } } = await worker.recognize(file);
                    console.log("OCR Result:", text);
                    alert("Scan complete! Check console for results.");
                    await worker.terminate();
                } catch (err) { 
                    console.error(err); 
                    alert("Scan failed."); 
                }
                setIsScanning(false);
            };

            const batchTabs = useMemo(() => ["ALL", ...[...new Set(workers.map(w => getBatch(w.no)))].sort()], [workers]);
            
            const filteredWorkers = useMemo(() => {
                return workers.filter(w => selectedBatch === "ALL" || getBatch(w.no) === selectedBatch)
                    .filter(w => selectedDistrict === "" || w.district === selectedDistrict)
                    .filter(w => `${w.engName} ${w.laoName} ${w.passport} ${w.id} ${w.no}`.toLowerCase().includes(searchQuery.toLowerCase()));
            }, [workers, selectedBatch, searchQuery, selectedDistrict]);

            const driveFrame = useMemo(() => {
                if (!selectedWorker?.driveUrl) return null;
                const match = selectedWorker.driveUrl.match(/folders\/([a-zA-Z0-9-_]+)/) || selectedWorker.driveUrl.match(/id=([a-zA-Z0-9-_]+)/);
                return match ? `https://drive.google.com/embeddedfolderview?id=${match[1]}#grid` : null;
            }, [selectedWorker]);

            if (loading) return <div className="h-screen flex items-center justify-center font-black">LOADING...</div>;

            return (
                <div className="flex h-screen w-screen bg-slate-100">
                    <div className="w-80 bg-white border-r flex flex-col">
                        <div className="flex flex-wrap p-2 gap-1 bg-slate-50 border-b">
                            {batchTabs.map(b => (
                                <button key={b} onClick={() => {setSelectedBatch(b); setSelectedWorker(null); setIsEditing(false);}} 
                                    className={`px-2 py-1 text-[9px] font-bold rounded ${selectedBatch === b ? 'bg-emerald-600 text-white' : 'bg-gray-200'}`}>{b}</button>
                            ))}
                        </div>
                        <div className="p-3 bg-white border-b space-y-2">
                            <input className="w-full p-2 text-xs border rounded-lg bg-slate-50" placeholder="Search ID, No, Name..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                            <select className="w-full p-2 text-[10px] border rounded-lg bg-slate-50" onChange={e => setSelectedDistrict(e.target.value)}>
                                <option value="">All Districts</option>
                                {[...new Set(workers.map(w => w.district).filter(Boolean))].map(d => <option key={d} value={d}>{d}</option>)}
                            </select>
                        </div>
                        <div className="flex-grow overflow-y-auto">
                            {filteredWorkers.map((w, i) => (
                                <div key={i} onClick={() => {setSelectedWorker(w); setIsEditing(false);}} className={`p-3 border-b cursor-pointer ${selectedWorker?._row === w._row ? 'list-item-active' : ''}`}>
                                    <div className="flex justify-between"><span className="font-black text-[10px] text-emerald-700">{w.no}</span><span className="text-[9px] text-slate-400">ID: {w.id}</span></div>
                                    <div className="font-bold text-sm truncate">{w.engName}</div>
                                    <div className="lao-text text-xs text-slate-500 truncate">{w.laoName}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="flex-grow p-6 overflow-y-auto relative">
                        {isScanning && <div className="absolute inset-0 bg-white/80 z-50 flex items-center justify-center font-black">SCANNING...</div>}
                        {selectedWorker ? (
                            <div className="bg-white p-6 rounded-2xl shadow-sm space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-xl font-black">{isEditing ? "EDITING" : selectedWorker.engName}</h2>
                                    <div className="flex gap-2">
                                        {isEditing ? (
                                            <>
                                                <label className="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg cursor-pointer">SCAN 📷<input type="file" className="hidden" onChange={handlePassportScan}/></label>
                                                <button onClick={() => setIsEditing(false)} className="px-4 py-2 text-xs font-bold text-slate-400">CANCEL</button>
                                                <button onClick={handleSave} className="px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-lg">SAVE</button>
                                            </>
                                        ) : (
                                            <button onClick={handleEditStart} className="bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-bold">EDIT PROFILE</button>
                                        )}
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    {FIELDS.map(f => (
                                        <div key={f.key}>
                                            <label className="text-[10px] uppercase font-bold text-slate-400">{f.label}</label>
                                            {isEditing ? (
                                                <input 
                                                    className="w-full font-semibold text-sm border-b pb-1 focus:outline-none focus:border-emerald-500 bg-emerald-50/50 px-1"
                                                    value={editData[f.key] || ''} 
                                                    placeholder={f.key === 'dob' ? 'DD-MM-YYYY' : f.key.includes('date') ? 'DD/MM/YYYY' : ''}
                                                    onChange={(e) => handleInputChange(f.key, e.target.value)} 
                                                />
                                            ) : (
                                                <div className="font-semibold text-sm border-b pb-1">
                                                    {selectedWorker[f.key] || '-'}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                {driveFrame && (
                                    <div className="mt-6">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-[10px] uppercase font-bold text-slate-400">Google Drive Preview</label>
                                            <a href={selectedWorker.driveUrl} target="_blank" className="text-blue-600 text-[10px] underline">Open in Drive ↗</a>
                                        </div>
                                        <iframe src={driveFrame} className="w-full h-64 border rounded-xl" />
                                    </div>
                                )}
                            </div>
                        ) : <div className="h-full flex items-center justify-center text-slate-400 font-bold">SELECT A WORKER</div>}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
