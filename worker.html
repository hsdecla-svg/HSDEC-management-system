<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSDEC Management System - Strict Column Matrix Version</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Phetsarath:wght@400;700&display=swap');

        body { font-family: 'Inter', sans-serif; background: #f1f5f9; height: 100vh; overflow: hidden; font-size: 13px; user-select: text !important; -webkit-user-select: text !important; }
        .lao-text { font-family: 'Phetsarath OT', 'Phetsarath', sans-serif; }
        .mrz-font { font-family: 'Courier New', Courier, monospace; letter-spacing: 0.05em; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input, select { border: 1px solid #e2e8f0 !important; }
        .list-item-active { background-color: #f0fdf4; border-right: 3px solid #10b981; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        window.loadTesseract = function() {
            if (window.Tesseract) return Promise.resolve();
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
                s.onload = resolve;
                document.head.appendChild(s);
            });
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzbFWDJT1hvJgBwGl2nenmberMbTw1fFm3bs8RJpa39f0-izFiECpNmViy69RJXvg8PZA/exec';
        
        // 画面レイアウトのブロック構成
        const FIELD_GROUPS = {
            basic: ['no', 'status', 'reEntry', 'laoName', 'engName', 'sex', 'dob', 'age', 'size'],
            passport: ['passport', 'dateOfIssue', 'dateOfExpiry'], // I, J がここに入っています
            address: ['village', 'district', 'province', 'acName', 'acNo', 'driveUrl'] // K, L, M がここに入っています
        };

        // 実際のA〜R列に基づいた日本語・ラオ語対応の正確な画面用ラベル
        const FIELD_LABELS = {
            'no': 'A: No. (連番)',
            'status': 'B: ສະຖານະ (ຄູ່ / ດ່ຽວ)',
            'reEntry': 'C: Re-entry (再入国)',
            'laoName': 'D: ຊື່ ແລະ ນາມສະກຸນ (ラオ語名)',
            'engName': 'E: Full Name (英語名)',
            'dob': 'G: Date of birth (生年月日)',
            'age': 'H: Age (年齢)',
            'passport': 'I: Passport No. (旅券番号)',
            'dateOfIssue': 'J: Date of issue (発行日)',
            'dateOfExpiry': 'K: Date of expiry (有効期限)',
            'village': 'L: Village (村)',
            'district': 'M: District (郡)',
            'province': 'N: Province (県)',
            'sex': 'F: Sex (M / F)',
            'driveUrl': 'R: Google drive URL',
            'size': 'O: Size (洋服サイズ)',
            'acName': 'P: AC - Name (口座名義)',
            'acNo': 'Q: AC - No (口座番号)'
        };

        // ユーザーから提供された確定スプレッドシート行列インデックスマッピング (0始まり)
        const STRICT_MATRIX = {
            no: 0,          // A
            status: 1,      // B
            reEntry: 2,     // C
            laoName: 3,     // D
            engName: 4,     // E
            dob: 5,         // F
            age: 6,         // G
            passport: 7,    // H
            dateOfIssue: 8, // I
            dateOfExpiry: 9,// J
            village: 10,    // K
            district: 11,   // L
            province: 12,   // M
            sex: 13,        // N
            driveUrl: 14,   // O
            size: 15,       // P
            acName: 16,     // Q
            acNo: 17        // R
        };

        // 配列構造・オブジェクト構造のどちらでも指定インデックスから「値」を100%確実にブッコ抜く処理
        const strictExtract = (rawRow, field) => {
            if (!rawRow) return "";
            const targetIdx = STRICT_MATRIX[field];

            // 1. GASからデータが純粋な配列として届いているケース
            if (Array.isArray(rawRow)) {
                return rawRow[targetIdx] !== undefined && rawRow[targetIdx] !== null ? String(rawRow[targetIdx]).trim() : "";
            }

            // 2. GASオブジェクトがインデックス番号のキー("0", "1", "2"...)を持っているケース
            if (rawRow[targetIdx] !== undefined && rawRow[targetIdx] !== null) return String(rawRow[targetIdx]).trim();
            if (rawRow[`_${targetIdx}`] !== undefined && rawRow[`_${targetIdx}`] !== null) return String(rawRow[`_${targetIdx}`]).trim();

            // 3. GASオブジェクトが英文字キー（ヘッダー文字列）で持っているケースのための予備走査
            const keys = Object.keys(rawRow);
            const lowerField = field.toLowerCase();
            for (let k of keys) {
                if (k.toLowerCase() === lowerField) {
                    return rawRow[k] !== undefined && rawRow[k] !== null ? String(rawRow[k]).trim() : "";
                }
            }

            // 4. どれにも当てはまらない場合はプロパティ直撃
            return rawRow[field] !== undefined && rawRow[field] !== null ? String(rawRow[field]).trim() : "";
        };

        const fixPassportNo = (raw) => {
            if (!raw) return "";
            let clean = raw.toUpperCase().replace(/[\s<]/g, '');
            let prefix = "";
            let body = "";

            if (clean.startsWith('PA')) { prefix = "PA"; body = clean.substring(2); }
            else if (clean.startsWith('P')) { prefix = "P"; body = clean.substring(1); }
            else { prefix = clean.substring(0, 1); body = clean.substring(1); }
            body = body.replace(/[GQKOD]/g, '0').replace(/I/g, '1').replace(/S/g, '5').replace(/Z/g, '2');
            return prefix + body.substring(0, 7); 
        };

        const cleanNameArea = (text) => {
            if (!text) return "";
            let name = text.split('<<<')[0];
            name = name.split(/[CKLS]{3,}/)[0]; 
            return name.replace(/<+/g, ' ').trim();
        };

        function App() {
            const [workers, setWorkers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedBatch, setSelectedBatch] = useState("");
            const [selectedWorker, setSelectedWorker] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [isScanning, setIsScanning] = useState(false);
            const [scanStatus, setScanStatus] = useState("");
            const [masterOptions, setMasterOptions] = useState({ Status: ["ຄູ່", "ດ່ຽວ"] });

            const screenMode = useMemo(() => {
                const params = new URLSearchParams(window.location.search);
                return params.get('mode') === 'mobile' ? 'mobile' : 'pc';
            }, []);

            useEffect(() => { fetchData(); }, []);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const response = await fetch(`${GAS_URL}?type=json`); 
                    const json = await response.json();

                    let allWorkers = [];
                    Object.keys(json).forEach(sheetName => {
                        if (sheetName !== 'options' && json[sheetName] && json[sheetName].rows) {
                            const sheetWorkers = json[sheetName].rows.map((rawRow, index) => {
                                // 指定された行列位置（STRICT_MATRIX）から確実にマッピング
                                return {
                                    _row: rawRow._row || (index + 2),
                                    batch: sheetName,
                                    no: strictExtract(rawRow, 'no'),
                                    status: strictExtract(rawRow, 'status'),
                                    reEntry: strictExtract(rawRow, 'reEntry'),
                                    laoName: strictExtract(rawRow, 'laoName'),
                                    engName: strictExtract(rawRow, 'engName'),
                                    dob: strictExtract(rawRow, 'dob'),
                                    age: strictExtract(rawRow, 'age'),
                                    passport: strictExtract(rawRow, 'passport'),
                                    dateOfIssue: strictExtract(rawRow, 'dateOfIssue'),
                                    dateOfExpiry: strictExtract(rawRow, 'dateOfExpiry'),
                                    village: strictExtract(rawRow, 'village'),
                                    district: strictExtract(rawRow, 'district'),
                                    province: strictExtract(rawRow, 'province'),
                                    sex: strictExtract(rawRow, 'sex'),
                                    driveUrl: strictExtract(rawRow, 'driveUrl'),
                                    size: strictExtract(rawRow, 'size'),
                                    acName: strictExtract(rawRow, 'acName'),
                                    acNo: strictExtract(rawRow, 'acNo'),
                                    _rawRawObj: rawRow // 元のオブジェクトをそのまま保存
                                };
                            });
                            allWorkers = allWorkers.concat(sheetWorkers);
                        }
                    });

                    setWorkers(allWorkers);
                    if (json.options && json.options.Status) {
                        setMasterOptions(json.options);
                    }

                    const batches = Object.keys(json).filter(name => name !== 'options');
                    if (batches.length > 0 && !selectedBatch) {
                        setSelectedBatch(batches[0]);
                    }
                } catch (e) { 
                    console.error("Fetch Data Matrix Error:", e); 
                }
                setLoading(false);
            };

            const batchList = useMemo(() => {
                return [...new Set(workers.map(w => w.batch))].filter(Boolean).sort();
            }, [workers]);

            const filteredWorkers = useMemo(() => {
                return workers
                    .filter(w => w.batch === selectedBatch)
                    .filter(w => {
                        const searchStr = `${w.engName} ${w.laoName} ${w.passport || ''}`.toLowerCase();
                        return searchStr.includes(searchQuery.toLowerCase());
                    }).sort((a,b) => (parseInt(a.no) || 0) - (parseInt(b.no) || 0));
            }, [workers, selectedBatch, searchQuery]);

            const passportDriveUrl = useMemo(() => {
                if (!selectedWorker || !selectedWorker.driveUrl) return null;
                const urlStr = selectedWorker.driveUrl;
                const match = urlStr.match(/folders\/([a-zA-Z0-9-_]+)/) || urlStr.match(/id=([a-zA-Z0-9-_]+)/);
                if (match && match[1]) {
                    return `https://drive.google.com/embeddedfolderview?id=${match[1]}#grid`;
                }
                return null;
            }, [selectedWorker]);

            const handlePassportScan = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsScanning(true);
                setScanStatus("OCR Initializing...");
                
                try {
                    await window.loadTesseract();
                    const workerOCR = await Tesseract.createWorker(['eng']);
                    await workerOCR.setParameters({
                        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<',
                        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK,
                    });

                    const img = new Image();
                    img.src = URL.createObjectURL(file);
                    await new Promise(r => img.onload = r);
                    
                    const { data: { text } } = await workerOCR.recognize(img);
                    await workerOCR.terminate();
                    
                    const mrzLines = text.split('\n').map(l => l.trim().replace(/\s/g, '')).filter(l => l.length >= 30);

                    if (mrzLines.length >= 2) {
                        const line1 = mrzLines[mrzLines.length - 2];
                        const line2 = mrzLines[mrzLines.length - 1];
                        let ext = { ...selectedWorker };

                        ext.passport = fixPassportNo(line2.substring(0, 9));
                        ext.engName = cleanNameArea(line1.substring(5));

                        const dobYY = line2.substring(13, 15);
                        const dobMM = line2.substring(15, 17);
                        const dobDD = line2.substring(17, 19);
                        const yearFull = parseInt(dobYY) < 50 ? `20${dobYY}` : `19${dobYY}`;
                        ext.dob = `${yearFull}/${dobMM}/${dobDD}`;
                        ext.age = ""; 
                        
                        ext.sex = line2[20] === 'M' ? 'M' : (line2[20] === 'F' ? 'F' : '');

                        const expYY = line2.substring(21, 23);
                        const expMM = line2.substring(23, 25);
                        const expDD = line2.substring(25, 27);
                        ext.dateOfExpiry = `20${expYY}/${expMM}/${expDD}`;

                        const expYearFull = parseInt(`20${expYY}`);
                        ext.dateOfIssue = `${expYearFull - 10}/${expMM}/${String(parseInt(expDD) + 1).padStart(2, '0')}`;

                        setSelectedWorker(ext);
                        setScanStatus("Scan Complete!");
                    } else { throw new Error("MRZ Area not found. Please try clear photo."); }
                } catch (err) { alert(err.message); }
                setIsScanning(false);
            };

            const handleSave = async () => {
                setIsSaving(true);
                try {
                    // スプレッドシートへ返すためのペイロード。元のオブジェクトの構造を復元
                    const basePayload = selectedWorker._rawRawObj ? { ...selectedWorker._rawRawObj } : {};
                    
                    // 配列・オブジェクト両対応のため、インデックス番号およびフィールド名の両方に値を書き込む
                    Object.keys(STRICT_MATRIX).forEach(field => {
                        const idx = STRICT_MATRIX[field];
                        basePayload[idx] = selectedWorker[field];
                        basePayload[`_${idx}`] = selectedWorker[field];
                        basePayload[field] = selectedWorker[field];
                    });

                    const payload = { 
                        ...basePayload,
                        ...selectedWorker,
                        action: selectedWorker._row ? "update" : "addNew", 
                        batch: selectedWorker.batch || selectedBatch
                    };

                    delete payload._rawRawObj;

                    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                    await fetchData();
                    setIsEditing(false);
                } catch (e) { alert("Save Error"); }
                setIsSaving(false);
            };

            const renderField = (field) => {
                const value = selectedWorker[field] || "";
                const label = FIELD_LABELS[field] || field;

                if (!isEditing) {
                    return (
                        <div key={field} className="border-b border-slate-100 py-2 flex justify-between items-center select-text">
                            <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">{label}</span>
                            <span className={`font-semibold text-slate-700 select-text ${field === 'laoName' ? 'lao-text text-sm' : ''} ${field === 'passport' ? 'mrz-font' : ''}`}>
                                {field === 'driveUrl' ? (value ? <a href={value} target="_blank" className="text-blue-500 underline">Link ↗</a> : '-') : 
                                 field === 'reEntry' ? (value === true || String(value).toUpperCase() === 'TRUE' ? '✅ Yes (再入国)' : '❌ No (未入国)') :
                                 value || '-'}
                            </span>
                        </div>
                    );
                }

                return (
                    <div key={field} className="flex flex-col mb-2.5">
                        <label className="text-[10px] font-bold text-slate-500 uppercase mb-0.5 tracking-wider">{label}</label>
                        
                        {field === 'sex' ? (
                            <select className="p-2 text-xs rounded bg-white w-full font-semibold" value={value}
                                onChange={e => setSelectedWorker({...selectedWorker, sex: e.target.value})}>
                                <option value="">- Select -</option>
                                <option value="M">M</option>
                                <option value="F">F</option>
                            </select>
                        ) : field === 'status' ? (
                            <select className="p-2 text-xs rounded bg-white w-full lao-text font-semibold" value={value}
                                onChange={e => setSelectedWorker({...selectedWorker, status: e.target.value})}>
                                <option value="">- Select -</option>
                                <option value="ຄູ່">ຄູ່ (夫婦枠)</option>
                                <option value="ດ່ຽວ">ດ່ຽວ (単独枠)</option>
                            </select>
                        ) : field === 'reEntry' ? (
                            <div className="flex items-center gap-2 mt-1">
                                <input type="checkbox" className="w-5 h-5 accent-emerald-600" 
                                    checked={value === true || String(value).toUpperCase() === 'TRUE' || value === 'TRUE'} 
                                    onChange={e => setSelectedWorker({...selectedWorker, reEntry: e.target.checked ? "TRUE" : ""})} />
                                <span className="text-xs text-slate-600 font-medium">TRUE (再入国対象)</span>
                            </div>
                        ) : (
                            <input className={`p-2 text-xs rounded w-full font-semibold ${field === 'laoName' ? 'lao-text' : ''}`} 
                                type="text"
                                value={value}
                                placeholder={['dob', 'dateOfIssue', 'dateOfExpiry'].includes(field) ? "YYYY/MM/DD" : ""}
                                disabled={field === 'age'} 
                                onChange={e => {
                                    setSelectedWorker({ ...selectedWorker, [field]: e.target.value });
                                }} />
                        )}
                    </div>
                );
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-black text-slate-700 tracking-widest bg-slate-100">HSDEC DIRECT MATRIX HUB LOADING...</div>;

            const isMobile = screenMode === 'mobile';

            return (
                <div className="flex h-screen w-screen overflow-hidden bg-slate-100">
                    
                    {/* 左サイドバー */}
                    <div className={`${isMobile ? (selectedWorker ? 'hidden' : 'w-full') : 'w-72 border-r'} bg-white flex flex-col shadow-sm z-10`}>
                        <div className="p-4 border-b bg-slate-50 space-y-3">
                            <div className="flex gap-2">
                                <select className="flex-grow p-2 text-xs font-black rounded border bg-white text-slate-700" value={selectedBatch || ''} onChange={e => {setSelectedBatch(e.target.value); setSelectedWorker(null);}}>
                                    {batchList.map(name => (
                                        <option key={name} value={name}>{name.toUpperCase()}</option>
                                    ))}
                                </select>
                                <button onClick={() => { setSelectedWorker({batch: selectedBatch}); setIsEditing(true); }} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-[11px] font-black tracking-wider uppercase shadow-sm">ADD NEW</button>
                            </div>
                            <input type="text" placeholder="Search parameters..." className="w-full p-2 text-xs rounded-xl border focus:outline-emerald-500" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                        </div>
                        <div className="flex-grow overflow-y-auto custom-scrollbar">
                            {filteredWorkers.map((w, i) => (
                                <div key={i} onClick={() => { setSelectedWorker(w); setIsEditing(false); }}
                                    className={`p-4 border-b cursor-pointer transition-all hover:bg-slate-50 ${selectedWorker?._row === w._row ? 'list-item-active' : ''}`}>
                                    <div className="flex justify-between items-center mb-1">
                                        <span className="text-[10px] text-slate-400 font-bold">#{w.no || '0'}</span>
                                        <span className="text-emerald-600 font-black text-xs uppercase tracking-tight">{w.engName || 'NO NAME'}</span>
                                    </div>
                                    <div className="text-slate-500 lao-text text-sm truncate">{w.laoName || '-'}</div>
                                </div>
                            ))}
                        </div>
                        <div className="p-3 bg-slate-50 border-t text-center">
                            <button onClick={() => location.href = 'index.html'} className="text-[11px] font-bold text-slate-400 hover:text-slate-600 uppercase tracking-widest">◀ Return to Portal</button>
                        </div>
                    </div>

                    <div className={`${isMobile ? (selectedWorker ? 'w-full flex' : 'hidden') : 'flex-grow flex'} flex-col bg-slate-50 overflow-hidden relative`}>
                        {isScanning && <div className="absolute inset-0 bg-slate-900/80 z-[100] flex flex-col items-center justify-center text-white backdrop-blur-sm">
                            <div className="animate-spin rounded-full h-12 w-12 border-4 border-emerald-500 border-t-transparent mb-4"></div>
                            <div className="text-xl font-bold tracking-widest">{scanStatus}</div>
                        </div>}
                        
                        {selectedWorker ? (
                            <>
                                {/* ヘッダーエリア */}
                                <div className="bg-white border-b px-4 py-3 md:px-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm shrink-0">
                                    <div className="flex items-center gap-3 w-full sm:w-auto">
                                        {isMobile && (
                                            <button onClick={() => { if(!isEditing){setSelectedWorker(null)}else{setIsEditing(false)} }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl font-black text-xs uppercase tracking-wider">
                                                ◀ Back
                                            </button>
                                        )}
                                        <div className="truncate select-text">
                                            <span className="text-base md:text-xl font-black text-slate-800 block truncate uppercase tracking-tight">{selectedWorker.engName || 'New Entry'}</span>
                                            <span className="text-emerald-600 lao-text text-base md:text-lg leading-tight block truncate">{selectedWorker.laoName || '-'}</span>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 items-center w-full sm:w-auto justify-end">
                                        {isEditing ? (
                                            <>
                                                <label className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-black text-[11px] shadow-sm cursor-pointer tracking-wider whitespace-nowrap">
                                                    📷 SCAN FILE
                                                    <input type="file" accept="image/*" className="hidden" onChange={handlePassportScan} />
                                                </label>
                                                <button onClick={() => setIsEditing(false)} className="px-3 py-2.5 text-[11px] font-black text-slate-400 uppercase tracking-wider">CANCEL</button>
                                                <button onClick={handleSave} disabled={isSaving} className="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl font-black text-[11px] tracking-wider uppercase shadow-sm">{isSaving ? 'SAVING...' : 'SAVE'}</button>
                                            </>
                                        ) : (
                                            <button onClick={() => setIsEditing(true)} className="w-full sm:w-auto bg-white border border-slate-200 hover:bg-slate-50 px-5 py-2.5 rounded-xl font-black text-[11px] shadow-sm tracking-wider uppercase text-slate-700">EDIT PROFILE</button>
                                        )}
                                    </div>
                                </div>

                                {/* メインコンテンツ */}
                                <div className={`p-4 md:p-6 grid ${isMobile ? 'grid-cols-1' : 'grid-cols-3'} gap-4 md:gap-6 h-full content-start overflow-y-auto custom-scrollbar select-text`}>
                                    
                                    {/* Personal Block */}
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm select-text">
                                        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 border-b pb-2">Personal</h4>
                                        {FIELD_GROUPS.basic.map(f => renderField(f))}
                                    </div>
                                    
                                    {/* Passport Block */}
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm select-text">
                                        <h4 className="text-[10px] font-black text-emerald-500 uppercase tracking-widest mb-3 border-b pb-2">Passport</h4>
                                        {FIELD_GROUPS.passport.map(f => renderField(f))}
                                    </div>
                                    
                                    {/* Address & Drive Block */}
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col select-text">
                                        <h4 className="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-3 border-b pb-2">Address & Drive</h4>
                                        <div className="mb-4">
                                            {FIELD_GROUPS.address.map(f => renderField(f))}
                                        </div>

                                        {/* ドキュメント表示 */}
                                        <div className="mt-2 flex-grow flex flex-col">
                                            <h5 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 flex items-center justify-between">
                                                <span>📄 Passport File Document</span>
                                            </h5>
                                            
                                            {passportDriveUrl ? (
                                                <div className="w-full bg-slate-50 border border-slate-200 rounded-xl overflow-hidden shadow-inner flex flex-col" style={{ height: '240px' }}>
                                                    <iframe 
                                                        src={passportDriveUrl} 
                                                        className="w-full h-full border-0" 
                                                        allow="autoplay"
                                                        title="Google Drive Passport Folder">
                                                    </iframe>
                                                </div>
                                            ) : (
                                                <div className="w-full h-32 bg-slate-50 border border-dashed border-slate-200 rounded-xl flex flex-col items-center justify-center text-slate-400 text-center p-4">
                                                    <span className="text-xl mb-1">📂</span>
                                                    <span className="text-[11px]">No Drive folder link available.</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    
                                </div>
                            </>
                        ) : (
                            <div className="h-full flex flex-col items-center justify-center text-slate-300 font-black uppercase tracking-[0.3em] text-center p-4">
                                <div className="text-4xl mb-2">👤</div>
                                <div className="text-sm md:text-xl">Select a Worker Profile</div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
